# ============================================================
# Next.js / Vite frontend -> Vercel
# Intended for GitHub-linked demos mirrored to GitLab, and for
# Convex-backed apps that deploy through Vercel.
#
# Required CI/CD variables (masked):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Optional:
#   CONVEX_DEPLOY_KEY + PRE_DEPLOY_COMMAND="npx convex deploy"
# ============================================================
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - validate
  - test
  - security
  - deploy:preview
  - deploy:prod

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  NODE_IMAGE: "node:20-bookworm"
  NPM_TEST_SCRIPT: ""          # set to "test:unit" if an offline unit suite exists
  VERCEL_CLI_VERSION: "latest"
  VERCEL_ROOT: "."
  PRE_DEPLOY_COMMAND: ""       # e.g. "npx convex deploy"
  PROD_BRANCH: "main"          # change to "master" if that is the default branch
  ENFORCE_JIRA_KEY: "false"

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.npm_cache:
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/

.vercel_env:
  before_script:
    - ': "${VERCEL_TOKEN:?Set VERCEL_TOKEN in GitLab CI/CD variables}"'
    - ': "${VERCEL_ORG_ID:?Set VERCEL_ORG_ID in GitLab CI/CD variables}"'
    - ': "${VERCEL_PROJECT_ID:?Set VERCEL_PROJECT_ID in GitLab CI/CD variables}"'
    - npm install --global "vercel@${VERCEL_CLI_VERSION}"
    - cd "$VERCEL_ROOT"
    - if [ -f package-lock.json ]; then npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline; else npm install --no-audit --no-fund; fi

validate:tag:
  stage: validate
  image: alpine:3.20
  script:
    - |
      set -e
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || {
          echo "Tag must match vMAJOR.MINOR.PATCH, got: $CI_COMMIT_TAG"
          exit 1
        }
      fi
  rules:
    - if: '$CI_COMMIT_TAG'

validate:mr-title:
  stage: validate
  image: alpine:3.20
  script:
    - |
      set -e
      if [ "$ENFORCE_JIRA_KEY" = "true" ]; then
        echo "$CI_MERGE_REQUEST_TITLE" | grep -Eq '[A-Z][A-Z0-9]+-[0-9]+' || {
          echo "MR title must include a Jira key, for example: feat(CPS-164): summary"
          exit 1
        }
      else
        echo "Jira key enforcement is disabled (ENFORCE_JIRA_KEY=false)"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

test:
  stage: test
  image: $NODE_IMAGE
  extends: .npm_cache
  before_script:
    - cd "$VERCEL_ROOT"
    - if [ -f package-lock.json ]; then npm ci --cache "$CI_PROJECT_DIR/.npm" --prefer-offline; else npm install --no-audit --no-fund; fi
  script:
    - npm run lint --if-present
    - npm run typecheck --if-present
    - |
      set -e
      if [ -n "$NPM_TEST_SCRIPT" ]; then
        npm run "$NPM_TEST_SCRIPT"
      else
        echo "No offline test script configured; skipping."
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ------------------------------------------------------------
# preview deployment for MRs and non-production branches
# ------------------------------------------------------------
deploy:preview:
  stage: deploy:preview
  image: $NODE_IMAGE
  extends:
    - .npm_cache
    - .vercel_env
  environment:
    name: "preview/$CI_COMMIT_REF_SLUG"
  script:
    - |
      set -e
      cd "$VERCEL_ROOT"
      vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
      vercel build --token="$VERCEL_TOKEN"
      DEPLOY_URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN" | tail -n1)
      echo "Preview: ${DEPLOY_URL}"
      echo "PREVIEW_URL=${DEPLOY_URL}" > "$CI_PROJECT_DIR/deploy.env"
  artifacts:
    reports:
      dotenv: deploy.env
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $PROD_BRANCH'

# ------------------------------------------------------------
# production deployment: manual on the production branch or a tag
# ------------------------------------------------------------
deploy:prod:
  stage: deploy:prod
  image: $NODE_IMAGE
  extends:
    - .npm_cache
    - .vercel_env
  environment:
    name: production
  script:
    - |
      set -e
      cd "$VERCEL_ROOT"
      if [ -n "$PRE_DEPLOY_COMMAND" ]; then
        sh -c "$PRE_DEPLOY_COMMAND"
      fi
      vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      vercel build --prod --token="$VERCEL_TOKEN"
      DEPLOY_URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n1)
      echo "Production: ${DEPLOY_URL}"
  rules:
    - if: '$CI_COMMIT_BRANCH == $PROD_BRANCH'
      when: manual
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$/'
      when: manual
  allow_failure: false

secret_detection:
  stage: security
