# ============================================================
# Angular -> WAR -> Payara
# Copy to the repo root as .gitlab-ci.yml and adjust variables.
#
# Required GitLab CI/CD variables (protected):
#   PAYARA_HOST, PAYARA_SSH_USER, PAYARA_SSH_PRIVATE_KEY
# ============================================================
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - validate
  - build
  - test
  - package
  - security
  - publish
  - deploy:dev
  - verify:dev
  - deploy:prod
  - verify:prod
  - rollback
  - notify

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  # ---- application identity (override per repo) ----
  APP_NAME: "svi-owa"
  DEV_CONTEXT_ROOT: "/dev/owa"
  PROD_CONTEXT_ROOT: "/owa"
  DEV_BASE_URL: "https://kyc.dev.svi.cloud"
  PROD_BASE_URL: "https://kyc.svi.cloud"
  HEALTH_PATH: "/"

  # ---- build ----
  NODE_IMAGE: "node:20-bookworm"
  ANGULAR_DIST_DIR: "dist/TPI-WebApp"

  # ---- branches ----
  DEV_BRANCH: "development"
  PROD_BRANCH: "master"

  # Payara server-side defaults (PAYARA_ASADMIN, PAYARA_PASSWORD_FILE,
  # PAYARA_ADMIN_USER, PAYARA_ADMIN_PORT, PAYARA_HTTP_PORT, PAYARA_BACKUP_DIR)
  # are read by /usr/local/bin/payara-deploy on the Payara host, not here.

  ENFORCE_JIRA_KEY: "false"

default:
  tags:
    - ec2-docker
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.npm_cache:
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/

validate:tag:
  stage: validate
  image: alpine:3.20
  script:
    - |
      set -e
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || {
          echo "Tag must match vMAJOR.MINOR.PATCH, got: $CI_COMMIT_TAG"
          exit 1
        }
      fi
  rules:
    - if: '$CI_COMMIT_TAG'

validate:mr-title:
  stage: validate
  image: alpine:3.20
  script:
    - |
      set -e
      if [ "$ENFORCE_JIRA_KEY" = "true" ]; then
        echo "$CI_MERGE_REQUEST_TITLE" | grep -Eq '[A-Z][A-Z0-9]+-[0-9]+' || {
          echo "MR title must include a Jira key, for example: feat(CPS-164): summary"
          exit 1
        }
      else
        echo "Jira key enforcement is disabled (ENFORCE_JIRA_KEY=false)"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

build:
  stage: build
  image: $NODE_IMAGE
  extends: .npm_cache
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends default-jdk-headless
    - npm ci --cache .npm --prefer-offline
  script:
    - |
      set -e
      if [ -n "$CI_COMMIT_TAG" ]; then
        CONTEXT_ROOT="$PROD_CONTEXT_ROOT"
        APP_VERSION="$CI_COMMIT_TAG"
      else
        CONTEXT_ROOT="$DEV_CONTEXT_ROOT"
        APP_VERSION="v0.0.0-dev-${CI_COMMIT_SHORT_SHA}"
      fi
      export APP_VERSION CONTEXT_ROOT
      npx ng build --configuration production --base-href "${CONTEXT_ROOT}/"
      GF="${ANGULAR_DIST_DIR}/WEB-INF/glassfish-web.xml"
      if [ -f "$GF" ]; then
        sed -i "s|<context-root>.*</context-root>|<context-root>${CONTEXT_ROOT}</context-root>|" "$GF"
      fi
      mkdir -p dist-war
      (cd "$ANGULAR_DIST_DIR" && jar -cf "../../dist-war/${APP_NAME}-${APP_VERSION}.war" .)
  artifacts:
    paths:
      - dist-war/*.war
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

test:
  stage: test
  image: $NODE_IMAGE
  extends: .npm_cache
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends chromium
    - printf '#!/bin/sh\nexec /usr/bin/chromium --no-sandbox "$@"\n' > /usr/local/bin/chromium-no-sandbox
    - chmod +x /usr/local/bin/chromium-no-sandbox
    - export CHROME_BIN=/usr/local/bin/chromium-no-sandbox
    - npm ci --cache .npm --prefer-offline
  script:
    - npm test -- --watch=false --browsers=ChromeHeadless
  artifacts:
    when: always
    paths:
      - coverage/
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

package:
  stage: package
  image: alpine:3.20
  needs: ["build"]
  script:
    - |
      set -e
      WAR=$(find dist-war -maxdepth 1 -name '*.war' | head -n1)
      [ -n "$WAR" ] || { echo "No WAR found in dist-war/"; exit 1; }
      if [ -n "$CI_COMMIT_TAG" ]; then
        ARTIFACT_VERSION="$CI_COMMIT_TAG"
      else
        ARTIFACT_VERSION="v0.0.0-dev-${CI_COMMIT_SHORT_SHA}"
      fi
      mkdir -p release
      ARTIFACT_NAME="${APP_NAME}-${ARTIFACT_VERSION}.war"
      cp "$WAR" "release/${ARTIFACT_NAME}"
      {
        echo "ARTIFACT_VERSION=${ARTIFACT_VERSION}"
        echo "ARTIFACT_NAME=${ARTIFACT_NAME}"
        echo "ARTIFACT_FILE=release/${ARTIFACT_NAME}"
      } > build.env
      echo "Built release/${ARTIFACT_NAME}"
  artifacts:
    paths:
      - release/*.war
    reports:
      dotenv: build.env
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

publish:
  stage: publish
  image: curlimages/curl:8.10.1
  needs: ["package"]
  script:
    - |
      set -e
      PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${APP_NAME}/${ARTIFACT_VERSION}/${ARTIFACT_NAME}"
      echo "Publishing ${ARTIFACT_FILE} to ${PACKAGE_URL}"
      curl --fail --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "${ARTIFACT_FILE}" \
        "${PACKAGE_URL}"
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH'
    - if: '$CI_COMMIT_TAG'

.payara_deploy:
  stage: deploy:dev
  image: alpine:3.20
  interruptible: false
  needs: ["package", "publish"]
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$PAYARA_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$PAYARA_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      set -e
      REMOTE_WAR="/tmp/${APP_NAME}-${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}.war"
      echo "Copying ${ARTIFACT_FILE} to ${PAYARA_HOST}:${REMOTE_WAR}"
      scp "${ARTIFACT_FILE}" "${PAYARA_SSH_USER}@${PAYARA_HOST}:${REMOTE_WAR}"
      ssh "${PAYARA_SSH_USER}@${PAYARA_HOST}" \
        "sudo -u payara /usr/local/bin/payara-deploy '${APP_NAME}' '${REMOTE_WAR}' '${DEPLOY_CONTEXT_ROOT}' '${HEALTH_PATH}'"
      ssh "${PAYARA_SSH_USER}@${PAYARA_HOST}" "rm -f '${REMOTE_WAR}'"
  resource_group: "deploy-${CI_ENVIRONMENT_NAME}-${CI_PROJECT_NAME}"

deploy:dev:
  extends: .payara_deploy
  stage: deploy:dev
  tags:
    - ec2-deploy
  environment:
    name: dev
    url: "${DEV_BASE_URL}${DEV_CONTEXT_ROOT}"
  variables:
    DEPLOY_CONTEXT_ROOT: "$DEV_CONTEXT_ROOT"
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH'

verify:dev:
  stage: verify:dev
  image: curlimages/curl:8.10.1
  tags:
    - ec2-deploy
  interruptible: false
  needs: ["deploy:dev"]
  script:
    - |
      set -e
      URL="${DEV_BASE_URL}${DEV_CONTEXT_ROOT}${HEALTH_PATH}"
      echo "Smoke testing ${URL}"
      for i in $(seq 1 30); do
        CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$URL" || true)
        echo "attempt ${i}: HTTP ${CODE}"
        case "$CODE" in
          200|201|204|301|302|401|403) echo "OK"; exit 0 ;;
        esac
        sleep 2
      done
      echo "Smoke test failed: ${URL}"
      exit 1
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH'

deploy:prod:
  extends: .payara_deploy
  stage: deploy:prod
  tags:
    - ec2-deploy
  environment:
    name: production
    url: "${PROD_BASE_URL}${PROD_CONTEXT_ROOT}"
  variables:
    DEPLOY_CONTEXT_ROOT: "$PROD_CONTEXT_ROOT"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$/'
      when: manual
  allow_failure: false

verify:prod:
  stage: verify:prod
  image: curlimages/curl:8.10.1
  tags:
    - ec2-deploy
  interruptible: false
  needs: ["deploy:prod"]
  script:
    - |
      set -e
      URL="${PROD_BASE_URL}${PROD_CONTEXT_ROOT}${HEALTH_PATH}"
      echo "Smoke testing ${URL}"
      for i in $(seq 1 30); do
        CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$URL" || true)
        echo "attempt ${i}: HTTP ${CODE}"
        case "$CODE" in
          200|201|204|301|302|401|403) echo "OK"; exit 0 ;;
        esac
        sleep 2
      done
      echo "Smoke test failed: ${URL}"
      exit 1
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$/'

rollback:prod:
  stage: rollback
  image: alpine:3.20
  tags:
    - ec2-deploy
  interruptible: false
  needs: []
  when: manual
  resource_group: "deploy-production-${CI_PROJECT_NAME}"
  environment:
    name: production
    action: rollback
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$PAYARA_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$PAYARA_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      set -e
      [ -n "$ROLLBACK_WAR" ] || { echo "Set ROLLBACK_WAR to a WAR path on the Payara host"; exit 1; }
      ssh "${PAYARA_SSH_USER}@${PAYARA_HOST}" \
        "sudo -u payara /usr/local/bin/payara-deploy '${APP_NAME}' '${ROLLBACK_WAR}' '${PROD_CONTEXT_ROOT}' '${HEALTH_PATH}'"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual

notify:
  stage: notify
  image: alpine:3.20
  script:
    - echo "Pipeline ${CI_PIPELINE_URL} finished for ${APP_NAME} (${CI_COMMIT_REF_NAME})"
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: always

secret_detection:
  stage: security
