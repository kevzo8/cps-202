# ============================================================
# Single-service Compose file used by deploy-compose.sh
# The deploy script exports APP_IMAGE, APP_NAME, APP_PORT,
# APP_ENV_FILE and HEALTH_PATH before running `docker compose`.
# ============================================================
services:
  app:
    image: "${APP_IMAGE:?APP_IMAGE is required}"
    container_name: "${APP_NAME:?APP_NAME is required}"
    restart: unless-stopped
    env_file:
      - "${APP_ENV_FILE:?APP_ENV_FILE is required}"
    environment:
      PORT: "${APP_PORT}"
      SERVER_PORT: "${APP_PORT}"
    ports:
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -qO- http://127.0.0.1:${APP_PORT}${HEALTH_PATH} >/dev/null 2>&1 || exit 1"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
