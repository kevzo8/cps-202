# ============================================================
# Spring Boot JAR -> Docker image -> EC2 Docker Compose
# Copy to the repo root as .gitlab-ci.yml and adjust variables.
#
# Runner requirement:
#   Docker executor with /var/run/docker.sock mounted, or a shell
#   runner that already has docker + docker compose installed.
#
# Required GitLab CI/CD variables (protected):
#   EC2_HOST, EC2_USER, EC2_SSH_PRIVATE_KEY
# ============================================================
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - validate
  - build
  - test
  - security
  - publish
  - deploy:dev
  - verify:dev
  - deploy:prod
  - verify:prod
  - rollback
  - notify

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  # ---- application identity (override per repo) ----
  APP_NAME: "spring-auth-services"
  APP_PORT: "8081"
  CONTEXT_PATH: "/spring/auth-services"
  # HEALTH_PATH is the full public path, including the context path.
  HEALTH_PATH: "/spring/auth-services/actuator/health"
  DEV_BASE_URL: "https://kyc.dev.svi.cloud"
  PROD_BASE_URL: "https://kyc.svi.cloud"

  # ---- build ----
  MAVEN_IMAGE: "maven:3.9-eclipse-temurin-25"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"
  DOCKER_IMAGE: "docker:27-cli"
  DOCKERFILE: "Dockerfile.springboot"
  DOCKER_HOST: "unix:///var/run/docker.sock"
  DOCKER_TLS_CERTDIR: ""

  # ---- deployment target ----
  EC2_APP_DIR: "/opt/svi/spring-auth-services"
  EC2_USER: "deploy"

  # ---- branches ----
  DEV_BRANCH: "development"
  PROD_BRANCH: "master"

  ENFORCE_JIRA_KEY: "false"

default:
  tags:
    - ec2-docker
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

.maven_cache:
  cache:
    key: "maven-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository

# ------------------------------------------------------------
# validate
# ------------------------------------------------------------
validate:tag:
  stage: validate
  image: alpine:3.20
  script:
    - |
      set -e
      if [ -n "$CI_COMMIT_TAG" ]; then
        echo "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$' || {
          echo "Tag must match vMAJOR.MINOR.PATCH, got: $CI_COMMIT_TAG"
          exit 1
        }
      fi
  rules:
    - if: '$CI_COMMIT_TAG'

validate:mr-title:
  stage: validate
  image: alpine:3.20
  script:
    - |
      set -e
      if [ "$ENFORCE_JIRA_KEY" = "true" ]; then
        echo "$CI_MERGE_REQUEST_TITLE" | grep -Eq '[A-Z][A-Z0-9]+-[0-9]+' || {
          echo "MR title must include a Jira key, for example: feat(CPS-164): summary"
          exit 1
        }
      else
        echo "Jira key enforcement is disabled (ENFORCE_JIRA_KEY=false)"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ------------------------------------------------------------
# build + test
# Tests are NOT skipped: two services had zero test coverage in CI.
# ------------------------------------------------------------
build:
  stage: build
  image: $MAVEN_IMAGE
  extends: .maven_cache
  script:
    - |
      set -e
      mvn $MAVEN_CLI_OPTS clean package -DskipTests
      JAR=$(find target -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n1)
      [ -n "$JAR" ] || { echo "No executable JAR found in target/"; exit 1; }
      cp "$JAR" target/app.jar
      echo "Selected $JAR"
  artifacts:
    paths:
      - target/app.jar
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

test:
  stage: test
  image: $MAVEN_IMAGE
  extends: .maven_cache
  script:
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ------------------------------------------------------------
# build + push image (runs after tests/security by stage order)
# ------------------------------------------------------------
publish:
  stage: publish
  image: $DOCKER_IMAGE
  script:
    - |
      set -e
      echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      IMAGE_REPO="${CI_REGISTRY_IMAGE}/${APP_NAME}"
      IMAGE_TAG="${CI_COMMIT_SHORT_SHA}"
      IMAGE_REF="${IMAGE_REPO}:${IMAGE_TAG}"
      docker build -f "$DOCKERFILE" -t "$IMAGE_REF" .
      docker push "$IMAGE_REF"
      if [ "$CI_COMMIT_BRANCH" = "$DEV_BRANCH" ]; then
        docker tag "$IMAGE_REF" "${IMAGE_REPO}:dev"
        docker push "${IMAGE_REPO}:dev"
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE_REF" "${IMAGE_REPO}:${CI_COMMIT_TAG}"
        docker push "${IMAGE_REPO}:${CI_COMMIT_TAG}"
      fi
      {
        echo "IMAGE_REPO=${IMAGE_REPO}"
        echo "IMAGE_TAG=${IMAGE_TAG}"
        echo "IMAGE_REF=${IMAGE_REF}"
      } > image.env
      echo "Published ${IMAGE_REF}"
  artifacts:
    reports:
      dotenv: image.env
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH'
    - if: '$CI_COMMIT_TAG'

# Optional: container scan. Enable when the GitLab runner can pull the
# private image and the team agrees on severity gates.
# scan:image:
#   stage: publish
#   image: aquasec/trivy:0.57.1
#   needs: ["publish"]
#   script:
#     - trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
#         --username "$CI_REGISTRY_USER" --password "$CI_JOB_TOKEN" "$IMAGE_REF"
#   allow_failure: true
#   rules:
#     - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH'
#     - if: '$CI_COMMIT_TAG'

# ------------------------------------------------------------
# deploy via /usr/local/bin/deploy-compose on the EC2 host
# ------------------------------------------------------------
.compose_deploy:
  stage: deploy:dev
  image: alpine:3.20
  tags:
    - ec2-deploy
  interruptible: false
  needs: ["publish"]
  before_script:
    - apk add --no-cache openssh-client
    - ': "${EC2_HOST:?Set EC2_HOST in GitLab CI/CD variables}"'
    - eval "$(ssh-agent -s)"
    - echo "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      set -e
      ssh "${EC2_USER}@${EC2_HOST}" \
        "APP_IMAGE='${IMAGE_REF}' APP_NAME='${APP_NAME}' APP_PORT='${APP_PORT}' HEALTH_PATH='${HEALTH_PATH}' /usr/local/bin/deploy-compose '${EC2_APP_DIR}'"
  resource_group: "deploy-${CI_ENVIRONMENT_NAME}-${CI_PROJECT_NAME}"

deploy:dev:
  extends: .compose_deploy
  stage: deploy:dev
  environment:
    name: dev
    url: "${DEV_BASE_URL}${CONTEXT_PATH}"
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH'

verify:dev:
  stage: verify:dev
  image: curlimages/curl:8.10.1
  tags:
    - ec2-deploy
  interruptible: false
  needs: ["deploy:dev"]
  script:
    - |
      set -e
      URL="${DEV_BASE_URL}${HEALTH_PATH}"
      echo "Smoke testing ${URL}"
      for i in $(seq 1 30); do
        CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$URL" || true)
        echo "attempt ${i}: HTTP ${CODE}"
        case "$CODE" in
          200|201|204|301|302|401|403) echo "OK"; exit 0 ;;
        esac
        sleep 2
      done
      echo "Smoke test failed: ${URL}"
      exit 1
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH'

deploy:prod:
  extends: .compose_deploy
  stage: deploy:prod
  environment:
    name: production
    url: "${PROD_BASE_URL}${CONTEXT_PATH}"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$/'
      when: manual
  allow_failure: false

verify:prod:
  stage: verify:prod
  image: curlimages/curl:8.10.1
  tags:
    - ec2-deploy
  interruptible: false
  needs: ["deploy:prod"]
  script:
    - |
      set -e
      URL="${PROD_BASE_URL}${HEALTH_PATH}"
      echo "Smoke testing ${URL}"
      for i in $(seq 1 30); do
        CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$URL" || true)
        echo "attempt ${i}: HTTP ${CODE}"
        case "$CODE" in
          200|201|204|301|302|401|403) echo "OK"; exit 0 ;;
        esac
        sleep 2
      done
      echo "Smoke test failed: ${URL}"
      exit 1
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?$/'

rollback:prod:
  stage: rollback
  image: alpine:3.20
  tags:
    - ec2-deploy
  interruptible: false
  needs: []
  when: manual
  resource_group: "deploy-production-${CI_PROJECT_NAME}"
  environment:
    name: production
    action: rollback
  before_script:
    - apk add --no-cache openssh-client
    - ': "${EC2_HOST:?Set EC2_HOST in GitLab CI/CD variables}"'
    - eval "$(ssh-agent -s)"
    - echo "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      set -e
      [ -n "$ROLLBACK_IMAGE" ] || { echo "Set ROLLBACK_IMAGE to a previously published image ref"; exit 1; }
      ssh "${EC2_USER}@${EC2_HOST}" \
        "APP_IMAGE='${ROLLBACK_IMAGE}' APP_NAME='${APP_NAME}' APP_PORT='${APP_PORT}' HEALTH_PATH='${HEALTH_PATH}' /usr/local/bin/deploy-compose '${EC2_APP_DIR}'"
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual

notify:
  stage: notify
  image: alpine:3.20
  script:
    - echo "Pipeline ${CI_PIPELINE_URL} finished for ${APP_NAME} (${CI_COMMIT_REF_NAME})"
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH'
      when: always
    - if: '$CI_COMMIT_TAG'
      when: always

secret_detection:
  stage: security
